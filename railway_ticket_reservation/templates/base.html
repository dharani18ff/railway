<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Railway Reservation{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <div class="wrap">
            <h1 class="brand">Railway Ticket Reservation</h1>
            <nav class="nav">
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('tracking') }}">Track Trains</a>
                <a href="{{ url_for('reservations') }}">Reservations</a>
                <a href="{{ url_for('manage') }}">Manage DB</a>
            </nav>
        </div>
    </header>

    <main class="main wrap">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section class="alerts">
                    {% for category, message in messages %}
                        <p class="alert alert-{{ category }}">{{ message }}</p>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
