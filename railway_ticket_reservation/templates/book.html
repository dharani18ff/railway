{% extends 'base.html' %}
{% block title %}Book Ticket{% endblock %}

{% block content %}
<section class="card">
    <h2>Book Ticket: {{ train.name }}</h2>
    <p class="meta">Train No: {{ train.number }} | {{ train.source }} to {{ train.destination }} | Base Fare: INR {{ train.fare }}</p>

    <form method="post" class="grid-form">
        <input type="hidden" name="travel_date" value="{{ travel_date }}">
        <input type="hidden" name="travel_class" value="{{ travel_class }}">

        <label>
            Travel Date
            <input type="text" value="{{ travel_date }}" disabled>
        </label>

        <label>
            Class
            <input type="text" value="{{ travel_class }}" disabled>
        </label>

        <label>
            Passenger Name
            <input type="text" name="passenger_name" placeholder="Enter full name" required>
        </label>

        <label>
            Age
            <input type="number" name="age" min="1" max="120" required>
        </label>

        <label>
            Gender
            <select name="gender" required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </label>

        <label>
            Seats
            <input type="number" name="seats" min="1" max="6" required>
        </label>

        <button type="submit">Confirm Booking</button>
    </form>
</section>
{% endblock %}
